<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Калькулятор падения напряжения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .calculator-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .main-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-bottom: none;
        }
        
        .card-header h2 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .card-body {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }
        
        .form-control, .form-select {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-calculate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 500;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
        }
        
        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .result-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        
        .result-alert {
            border-radius: 10px;
            padding: 20px;
            margin: 0;
        }
        
        .result-alert h4 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .result-label {
            color: #666;
            font-weight: 500;
        }
        
        .result-value {
            color: #333;
            font-weight: 600;
        }
        
        .breaker-section {
            background: linear-gradient(135deg, #f6f9fc 0%, #e9f2f9 100%);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #b8daff;
        }
        
        .breaker-title {
            font-size: 16px;
            font-weight: 600;
            color: #0056b3;
            margin-bottom: 10px;
        }
        
        .breaker-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid;
        }
        
        .breaker-box.current {
            border-left-color: #ffc107;
        }
        
        .breaker-box.recommended {
            border-left-color: #28a745;
        }
        
        .breaker-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        
        .breaker-type {
            background: #e9ecef;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .breaker-characteristic {
            display: inline-block;
            padding: 3px 8px;
            background: #0056b3;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .warning-message {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .danger-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .info-box {
            background: #e3f2fd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .success-box {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .history-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .history-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .history-item:hover {
            transform: translateX(5px);
            background: #e9ecef;
        }
        
        .history-date {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .history-content {
            font-size: 14px;
        }
        
        .graph-container {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }
        
        .graph-container canvas {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        
        .badge-pro {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .table-breaker {
            font-size: 14px;
            margin-top: 10px;
        }
        
        .table-breaker th {
            background: #f8f9fa;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="main-card">
        <div class="card-header">
            <h2>PRO Калькулятор падения напряжения 
                <span class="badge-pro">PRO</span>
            </h2>
            <p class="mb-0 mt-2">Профессиональный расчет с выбором сечения кабеля и автоматических выключателей</p>
        </div>
        
        <div class="card-body">
            <form id="calculatorForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="voltage">Напряжение (В):</label>
                            <select class="form-control" id="voltage" name="voltage">
                                <option value="12">12 В</option>
                                <option value="24">24 В</option>
                                <option value="48">48 В</option>
                                <option value="110">110 В</option>
                                <option value="220" selected>220 В</option>
                                <option value="380">380 В</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="power">Мощность нагрузки (Вт):</label>
                            <input type="number" class="form-control" id="power" name="power" 
                                   placeholder="Введите мощность" value="2000" min="0" step="100">
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="length">Длина линии (м):</label>
                            <input type="number" class="form-control" id="length" name="length" 
                                   placeholder="Введите длину" value="50" min="0" step="5">
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="material">Материал жил:</label>
                            <select class="form-control" id="material" name="material">
                                <option value="copper" selected>Медь</option>
                                <option value="aluminum">Алюминий</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="cableSection">Выберите сечение кабеля (мм²):</label>
                    <select class="form-control" id="cableSection" name="cableSection">
                        <option value="1.5">1.5 мм²</option>
                        <option value="2.5" selected>2.5 мм²</option>
                        <option value="4">4 мм²</option>
                        <option value="6">6 мм²</option>
                        <option value="10">10 мм²</option>
                        <option value="16">16 мм²</option>
                        <option value="25">25 мм²</option>
                        <option value="35">35 мм²</option>
                        <option value="50">50 мм²</option>
                        <option value="70">70 мм²</option>
                        <option value="95">95 мм²</option>
                        <option value="120">120 мм²</option>
                        <option value="150">150 мм²</option>
                        <option value="185">185 мм²</option>
                        <option value="240">240 мм²</option>
                    </select>
                </div>
                
                <button type="button" class="btn-calculate" onclick="calculateDrop()">
                    Рассчитать параметры
                </button>
            </form>
        </div>
    </div>
    
    <div id="result" class="result-card" style="display: none;"></div>
    <div id="graphContainer" class="graph-container" style="display: none;">
        <canvas id="voltageGraph" width="400" height="100"></canvas>
    </div>
    <div id="historyContainer" class="history-card" style="display: none;">
        <div class="history-header">
            <h5>История расчетов</h5>
            <button class="btn btn-sm btn-outline-secondary" onclick="clearHistory()">Очистить</button>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<script>
    // Удельное сопротивление материалов (Ом*мм²/м)
    const RESISTIVITY = {
        'copper': 0.0175,
        'aluminum': 0.028
    };
    
    // Таблица допустимых токов для меди и алюминия (А)
    const CURRENT_TABLE = {
        'copper': {
            1.5: 19, 2.5: 27, 4: 36, 6: 46, 10: 63, 16: 85,
            25: 115, 35: 140, 50: 175, 70: 220, 95: 270,
            120: 315, 150: 360, 185: 410, 240: 485
        },
        'aluminum': {
            1.5: 15, 2.5: 21, 4: 28, 6: 36, 10: 50, 16: 67,
            25: 90, 35: 110, 50: 140, 70: 175, 95: 215,
            120: 250, 150: 290, 185: 330, 240: 390
        }
    };
    
    // Стандартные номиналы автоматических выключателей (А)
    const BREAKER_RATINGS = [6, 10, 13, 16, 20, 25, 32, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000];
    
    // Типы характеристик автоматов и их применение
    const BREAKER_CHARACTERISTICS = {
        'B': 'Для освещения и бытовых нагрузок (3-5 In)',
        'C': 'Для смешанных нагрузок и небольших моторов (5-10 In)',
        'D': 'Для мощных моторов и трансформаторов (10-20 In)'
    };
    
    // История расчетов
    let calculationHistory = [];
    
    // Загрузка истории из localStorage при старте
    function loadHistory() {
        const saved = localStorage.getItem('calcHistory');
        if (saved) {
            calculationHistory = JSON.parse(saved);
            showHistory();
        }
    }
    
    // Сохранение в историю
    function saveToHistory(params, results) {
        calculationHistory.unshift({
            date: new Date().toLocaleString(),
            params: params,
            results: results
        });
        
        // Ограничиваем историю 10 записями
        if (calculationHistory.length > 10) {
            calculationHistory = calculationHistory.slice(0, 10);
        }
        
        localStorage.setItem('calcHistory', JSON.stringify(calculationHistory));
        showHistory();
        document.getElementById('historyContainer').style.display = 'block';
    }
    
    // Отображение истории
    function showHistory() {
        const historyList = document.getElementById('historyList');
        if (calculationHistory.length === 0) {
            historyList.innerHTML = '<p class="text-muted">История расчетов пуста</p>';
            return;
        }
        
        historyList.innerHTML = calculationHistory.map((item, index) => `
            <div class="history-item" onclick="loadFromHistory(${index})">
                <div class="history-date">${item.date}</div>
                <div class="history-content">
                    <strong>${item.params.power} Вт</strong> | ${item.params.voltage}В | 
                    ${item.params.length}м | ${item.params.cableSection}мм² (${item.params.material === 'copper' ? 'Cu' : 'Al'})
                    <br>
                    <small>Падение: ${item.results.voltageDropPercent}% | Автомат: ${item.results.breakerCurrent || '—'}A</small>
                </div>
            </div>
        `).join('');
    }
    
    // Загрузка из истории
    function loadFromHistory(index) {
        const item = calculationHistory[index];
        document.getElementById('voltage').value = item.params.voltage;
        document.getElementById('power').value = item.params.power;
        document.getElementById('length').value = item.params.length;
        document.getElementById('material').value = item.params.material;
        document.getElementById('cableSection').value = item.params.cableSection;
        calculateDrop();
    }
    
    // Очистка истории
    function clearHistory() {
        calculationHistory = [];
        localStorage.removeItem('calcHistory');
        showHistory();
        document.getElementById('historyContainer').style.display = 'none';
    }
    
    // Получение максимально допустимого тока по сечению
    function getMaxCurrent(section, material) {
        return CURRENT_TABLE[material]?.[section] || 0;
    }
    
    // Рекомендация сечения по току
    function getRecommendedSection(current, material) {
        const sections = Object.keys(CURRENT_TABLE[material]).map(Number).sort((a, b) => a - b);
        
        for (let section of sections) {
            if (CURRENT_TABLE[material][section] >= current * 1.1) { // Запас 10%
                return section;
            }
        }
        return sections[sections.length - 1];
    }
    
    // Подбор номинала автоматического выключателя
    function selectBreaker(current, maxCurrent, section) {
        // Правила выбора автомата:
        // 1. Номинал автомата должен быть меньше или равен максимальному току кабеля
        // 2. Номинал автомата должен быть больше или равен рабочему току
        // 3. Выбираем ближайший стандартный номинал
        
        let selectedBreaker = null;
        
        for (let rating of BREAKER_RATINGS) {
            if (rating >= current && rating <= maxCurrent) {
                selectedBreaker = rating;
                break;
            }
        }
        
        // Если не нашли подходящий (ток слишком маленький или большой)
        if (!selectedBreaker) {
            if (current > maxCurrent) {
                // Ток превышает допустимый для кабеля
                selectedBreaker = BREAKER_RATINGS.find(r => r <= maxCurrent) || maxCurrent;
            } else {
                // Для очень маленьких токов
                selectedBreaker = BREAKER_RATINGS[0];
            }
        }
        
        return selectedBreaker;
    }
    
    // Определение рекомендуемой характеристики автомата
    function getRecommendedCharacteristic(power, voltage) {
        const current = power / voltage;
        
        // Для бытовых нагрузок обычно используют характеристику C
        // Для освещения - B
        // Для мощных моторов - D
        
        if (power < 1000) {
            return 'B'; // Для освещения и слаботочных нагрузок
        } else if (power >= 1000 && power < 5000) {
            return 'C'; // Для смешанных нагрузок
        } else {
            return 'D'; // Для мощных нагрузок с пусковыми токами
        }
    }
    
    // Рисование графика напряжения
    function drawVoltageGraph(voltage, voltageDrop) {
        const canvas = document.getElementById('voltageGraph');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('graphContainer');
        
        container.style.display = 'block';
        
        // Очистка canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const startX = 50;
        const endX = 350;
        const y = 50;
        const remainingVoltage = voltage - voltageDrop;
        const dropPointX = startX + (endX - startX) * (remainingVoltage / voltage);
        
        // Рисование фона
        ctx.fillStyle = '#f8f9fa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Рисование шкалы
        ctx.beginPath();
        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.moveTo(startX, 30);
        ctx.lineTo(startX, 70);
        ctx.moveTo(endX, 30);
        ctx.lineTo(endX, 70);
        ctx.stroke();
        
        // Рисование линии напряжения (зеленая - оставшееся напряжение)
        ctx.beginPath();
        ctx.strokeStyle = '#28a745';
        ctx.lineWidth = 4;
        ctx.setLineDash([]);
        ctx.moveTo(startX, y);
        ctx.lineTo(dropPointX, y);
        ctx.stroke();
        
        // Рисование линии падения (красная - потеря)
        ctx.beginPath();
        ctx.strokeStyle = '#dc3545';
        ctx.lineWidth = 4;
        ctx.setLineDash([5, 3]);
        ctx.moveTo(dropPointX, y);
        ctx.lineTo(endX, y);
        ctx.stroke();
        
        // Рисование маркеров
        ctx.beginPath();
        ctx.fillStyle = '#28a745';
        ctx.arc(startX, y, 6, 0, 2 * Math.PI);
        ctx.fill();
        
        ctx.beginPath();
        ctx.fillStyle = '#ffc107';
        ctx.arc(dropPointX, y, 6, 0, 2 * Math.PI);
        ctx.fill();
        
        ctx.beginPath();
        ctx.fillStyle = '#dc3545';
        ctx.arc(endX, y, 6, 0, 2 * Math.PI);
        ctx.fill();
        
        // Подписи
        ctx.fillStyle = '#333';
        ctx.font = '12px Arial';
        ctx.fillText(`${voltage}V`, startX - 30, y - 10);
        ctx.fillText(`${remainingVoltage.toFixed(1)}V`, dropPointX - 30, y - 20);
        ctx.fillText(`-${voltageDrop.toFixed(1)}V`, endX + 10, y - 10);
    }
    
    // Основная функция расчета
    function calculateDrop() {
        // Получаем значения из формы
        const voltage = parseFloat(document.getElementById('voltage').value);
        const power = parseFloat(document.getElementById('power').value);
        const length = parseFloat(document.getElementById('length').value);
        const material = document.getElementById('material').value;
        const cableSection = parseFloat(document.getElementById('cableSection').value);
        
        // Проверка на корректность ввода
        if (!voltage || !power || !length || !cableSection) {
            alert('Пожалуйста, заполните все поля корректными значениями');
            return;
        }
        
        // Расчет тока
        const current = power / voltage;
        
        // Расчет сопротивления кабеля (с учетом двух жил)
        const resistance = (RESISTIVITY[material] * length * 2) / cableSection;
        
        // Расчет падения напряжения
        const voltageDrop = current * resistance;
        const voltageDropPercent = (voltageDrop / voltage) * 100;
        
        // Расчет потери мощности
        const powerLoss = Math.pow(current, 2) * resistance;
        
        // Определение рекомендуемого сечения
        const recommendedSection = getRecommendedSection(current, material);
        
        // Проверка по допустимому току
        const maxCurrent = getMaxCurrent(cableSection, material);
        const isCurrentOverload = current > maxCurrent;
        
        // Получение максимального тока для рекомендуемого сечения
        const recommendedMaxCurrent = getMaxCurrent(recommendedSection, material);
        
        // Подбор автомата для текущего сечения
        const breakerCurrent = selectBreaker(current, maxCurrent, cableSection);
        const breakerCharacteristic = getRecommendedCharacteristic(power, voltage);
        
        // Подбор автомата для рекомендуемого сечения
        const recommendedBreakerCurrent = selectBreaker(current, recommendedMaxCurrent, recommendedSection);
        const recommendedBreakerCharacteristic = getRecommendedCharacteristic(power, voltage);
        
        // Формирование результата
        let resultHTML = `
            <div class="result-alert alert-info">
                <h4>Результаты расчета:</h4>
                
                <div class="result-item">
                    <span class="result-label">Ток нагрузки:</span>
                    <span class="result-value">${current.toFixed(2)} А</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">Выбранное сечение:</span>
                    <span class="result-value">${cableSection} мм²</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">Сопротивление линии:</span>
                    <span class="result-value">${resistance.toFixed(4)} Ом</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">Падение напряжения:</span>
                    <span class="result-value">${voltageDrop.toFixed(2)} В (${voltageDropPercent.toFixed(2)}%)</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">Потери мощности:</span>
                    <span class="result-value">${powerLoss.toFixed(2)} Вт</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">Напряжение в конце линии:</span>
                    <span class="result-value">${(voltage - voltageDrop).toFixed(2)} В</span>
                </div>
                
                <hr>
                
                <div class="result-item">
                    <span class="result-label">Рекомендуемое сечение по току:</span>
                    <span class="result-value">${recommendedSection} мм²</span>
                </div>
        `;
        
        // Блок с автоматическими выключателями
        resultHTML += `
            <div class="breaker-section">
                <div class="breaker-title">🔌 Выбор автоматического выключателя</div>
                
                <div class="breaker-box current">
                    <div>
                        <strong>Для текущего сечения (${cableSection} мм²)</strong>
                        <div><small>Допустимый ток кабеля: ${maxCurrent} А</small></div>
                    </div>
                    <div>
                        <span class="breaker-value">${breakerCurrent} А</span>
                        <span class="breaker-characteristic">${breakerCharacteristic}</span>
                    </div>
                </div>
                
                <div class="breaker-box recommended">
                    <div>
                        <strong>Для рекомендуемого сечения (${recommendedSection} мм²)</strong>
                        <div><small>Допустимый ток кабеля: ${recommendedMaxCurrent} А</small></div>
                    </div>
                    <div>
                        <span class="breaker-value">${recommendedBreakerCurrent} А</span>
                        <span class="breaker-characteristic">${recommendedBreakerCharacteristic}</span>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-sm table-breaker">
                        <thead>
                            <tr>
                                <th>Характеристика</th>
                                <th>Применение</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>B</td>
                                <td>Освещение, слаботочные нагрузки</td>
                            </tr>
                            <tr>
                                <td>C</td>
                                <td>Смешанные нагрузки, розетки, бытовая техника</td>
                            </tr>
                            <tr>
                                <td>D</td>
                                <td>Мощные моторы, трансформаторы, насосы</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        
        // Добавление предупреждений
        if (isCurrentOverload) {
            resultHTML += `
                <div class="danger-message">
                    ⚠️ ПРЕВЫШЕНИЕ ДОПУСТИМОГО ТОКА!<br>
                    Ток ${current.toFixed(2)} А превышает максимально допустимый ${maxCurrent} А для сечения ${cableSection} мм².<br>
                    <strong>Рекомендуется увеличить сечение до ${recommendedSection} мм² и установить автомат ${recommendedBreakerCurrent} А</strong>
                </div>
            `;
        } else {
            // Проверка соответствия автомата и кабеля
            if (breakerCurrent > maxCurrent) {
                resultHTML += `
                    <div class="warning-message">
                        ⚠️ Выбранный автомат ${breakerCurrent} А превышает допустимый ток кабеля ${maxCurrent} А!<br>
                        Это может привести к перегреву кабеля. Рекомендуется уменьшить номинал автомата.
                    </div>
                `;
            } else if (breakerCurrent < current * 0.9) {
                resultHTML += `
                    <div class="warning-message">
                        ⚠️ Автомат ${breakerCurrent} А может срабатывать при пиковых нагрузках.<br>
                        Рекомендуется установить автомат номиналом ${recommendedBreakerCurrent} А.
                    </div>
                `;
            } else {
                resultHTML += `
                    <div class="success-box">
                        ✅ Автомат ${breakerCurrent} А (${breakerCharacteristic}) правильно подобран для данного сечения и нагрузки.
                    </div>
                `;
            }
        }
        
        if (voltageDropPercent > 5) {
            resultHTML += `
                <div class="warning-message">
                    ⚠️ Падение напряжения (${voltageDropPercent.toFixed(2)}%) превышает рекомендуемые 5%!<br>
                    Рекомендуется увеличить сечение кабеля до ${recommendedSection} мм² или уменьшить длину линии.
                </div>
            `;
        } else if (voltageDropPercent > 3) {
            resultHTML += `
                <div class="info-box">
                    ℹ️ Падение напряжения в пределах нормы (до 5%), но для ответственных потребителей рекомендуется не более 3%.
                </div>
            `;
        } else {
            resultHTML += `
                <div class="info-box">
                    ✅ Падение напряжения в пределах оптимальных значений (менее 3%).
                </div>
            `;
        }
        
        resultHTML += `</div>`;
        
        // Отображение результата
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = resultHTML;
        resultDiv.style.display = 'block';
        
        // Рисование графика
        drawVoltageGraph(voltage, voltageDrop);
        
        // Сохранение в историю
        saveToHistory({
            voltage: voltage,
            power: power,
            length: length,
            material: material,
            cableSection: cableSection
        }, {
            voltageDrop: voltageDrop.toFixed(2),
            voltageDropPercent: voltageDropPercent.toFixed(2),
            current: current.toFixed(2),
            breakerCurrent: breakerCurrent,
            breakerCharacteristic: breakerCharacteristic,
            recommendedBreakerCurrent: recommendedBreakerCurrent
        });
        
        // Плавная прокрутка к результату
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    
    // Загрузка истории при старте
    window.onload = function() {
        loadHistory();
        
        // Добавление обработчика для клавиши Enter
        document.getElementById('calculatorForm').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                calculateDrop();
            }
        });
    };
</script>
